<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 • Tyxar</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <footer id="header"></footer>
    <div class="error-page">

        <img src="/tyxar_web/images/tyxar.png"" alt="Tyxar Logo" class="logo">

        <h1>404</h1>

        <h2>Page Not Found</h2>

        <p>
            The page you requested doesn't exist or may have been moved.
        </p>

        <a class="home-button" href="/tyxar_web/">
            Return Home
        </a>

        <p id="countdown">
            Redirecting to the homepage in 15 seconds...
        </p>

        
    </div>
    <footer id="footer"></footer>
    <script>

        let seconds = 15;

        const text = document.getElementById("countdown");

        const timer = setInterval(() => {

            seconds--;

            if (seconds > 0) {
                text.textContent =
                    `Redirecting to the homepage in ${seconds} second${seconds === 1 ? "" : "s"}...`;
            } else {

                clearInterval(timer);

                window.location.href = "/tyxar_web/";

            }

        }, 1000);

    </script>
    <script src="/tyxar_web/script.js"></script>
    <script>
        fetch('/tyxar_web/header.html')
                .then(function (response) { return response.text(); })
                .then(function (data) {
                    const header = document.getElementById('header');
                    if (header) header.innerHTML = data;
                })
                .catch(function (err) {
                    console.error('Error loading header:', err);
                });

            fetch('/tyxar_web/footer.html')
                .then(function (response) { return response.text(); })
                .then(function (data) {
                    const footer = document.getElementById('footer');
                    if (footer) footer.innerHTML = data;
                })
                .catch(function (err) {
                    console.error('Error loading footer:', err);
                });
    </script>

</body>

</html>
